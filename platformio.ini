; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = default

[common]
extra_scripts = post:extra_script.py
; The LDF cannot evaluate TinyUSB's headers (TU_CHECK_MCU) and falls back to the
; classic preprocessor, which ignores the `#ifdef USE_TINYUSB` guard around the
; Adafruit_TinyUSB.h include in Adafruit_NeoPixel.h. That pulls the framework's
; TinyUSB library into the build even though this project uses the stock USB
; stack (MIDIUSB), and it fails to compile without USE_TINYUSB.
lib_ignore = Adafruit TinyUSB Library
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[common:adafruit_trellis_m4]
extends = common
platform = atmelsam @ 9.0.0
board = adafruit_trellis_m4
framework = arduino
; The platform's own package ranges are tilde ranges, so the framework (and with
; it the bundled TinyUSB) can still move under a pinned platform. Pin it too.
platform_packages =
    platformio/framework-arduino-samd-adafruit @ 1.10716.0
    platformio/framework-cmsis @ 2.50400.181126
    platformio/framework-cmsis-atmel @ 1.2.2
    platformio/toolchain-gccarmnoneeabi @ 1.90301.200702
lib_deps =
    adafruit/Adafruit ADXL343 @ 1.6.4
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit DMA neopixel library @ 1.3.3
    adafruit/Adafruit Keypad @ 1.3.2
    adafruit/Adafruit NeoPixel @ 1.15.5
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit Zero DMA Library @ 1.1.4
    arduino-libraries/MIDIUSB @ 1.0.5

[common:native]
extends = common
platform = native

[env:default]
extends = common:adafruit_trellis_m4
build_flags =
    ${common.build_flags}
    -D RELEASE

[env:dev]
extends = common:adafruit_trellis_m4
build_flags =
    ${common.build_flags}
    -D DEBUG
    -D INTERNAL_CLOCK

[env:native]
extends = common:native
build_flags =
    ${common.build_flags}
    -I src

